<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة تحكم المطعم</title>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/skeleton.css">
</head>
<body>
  <!-- Skeleton loader: visible until page fully loads / offline handling -->
  <div id="app-skeleton" aria-hidden="false" aria-label="Loading">
    <div class="sk-skeleton-topbar">
      <div class="sk-logo shimmer" aria-hidden="true"></div>
      <div class="sk-brand shimmer"></div>
      <div class="sk-nav" aria-hidden="true"><span class="shimmer"></span><span class="shimmer"></span><span class="shimmer"></span><span class="shimmer"></span></div>
      <div class="sk-actions"><span class="sk-btn shimmer"></span><span class="sk-btn shimmer" style="width:110px"></span></div>
    </div>
    <div class="sk-hero">
      <div class="sk-hero-left">
        <div class="sk-pill shimmer"></div>
        <div class="sk-h1 shimmer"></div><div class="sk-h1-2 shimmer"></div>
        <div class="sk-p shimmer"></div><div class="sk-p-2 shimmer"></div>
        <div class="sk-cta"><span class="shimmer"></span><span class="shimmer"></span></div>
      </div>
      <div class="sk-visual shimmer"><div class="sk-phone shimmer"></div><div class="sk-card shimmer"></div><div class="sk-card shimmer"></div><div class="sk-card shimmer"></div></div>
    </div>
    <div class="sk-cards"><div class="sk-mini shimmer"></div><div class="sk-mini shimmer"></div><div class="sk-mini shimmer"></div><div class="sk-mini shimmer"></div><div class="sk-mini shimmer"></div></div>
  </div>
  <div id="sk-offline" class="sk-offline" role="status" aria-live="polite">You appear offline — check your connection <button id="sk-offline-retry" type="button">Retry</button></div>
  <div id="sk-retry" class="sk-retry" role="alert"><p style="margin:0 0 8px; font-weight:700">Connection is slow or offline</p><p class="muted small" style="margin:0 0 12px">The page is taking longer than usual. Check your internet or try again.</p><button id="sk-retry-btn" class="btn btn-sm" type="button">Retry</button></div>

  <header class="topbar">
    <div class="topbar-inner container">
      <img id="brand-logo" class="logo-sm hidden" src="" alt="">
      <span class="brand" id="restaurant-name">لوحة التحكم</span>
      <span id="open-badge"></span>
      <span class="spacer"></span>
      <button id="logout-btn" type="button" class="btn btn-outline btn-sm" data-i18n="logout">خروج</button>
    </div>
  </header>

  <div class="dash-layout">
    <nav class="dash-side" aria-label="Sections">
      <button class="side-link active" data-tab="dashboard" data-i18n="dash">لوحة التحكم</button>
      <button class="side-link" data-tab="orders"><span data-i18n="ordersTab">الطلبات</span> <span id="orders-live-dot" class="badge badge-open hidden" data-i18n="live">مباشر</span></button>
      <button class="side-link" data-tab="bookings" data-i18n="bookingsTab">الحجوزات</button>
      <button class="side-link" data-tab="menu" data-i18n="menuTab">القائمة</button>
      <button class="side-link" data-tab="settings" data-i18n="settingsTab">الإعدادات</button>
      <button class="side-link" data-tab="analytics" data-i18n="analyticsTab">التحليلات</button>
      <button class="side-link" data-tab="share" data-i18n="shareNav">مشاركة</button>
    </nav>

    <main class="dash-main">
      <div class="tabs-mobile">
        <button class="tab-btn active" data-tab="dashboard" data-i18n="dash">لوحة التحكم</button>
        <button class="tab-btn" data-tab="orders" data-i18n="ordersTab">الطلبات</button>
        <button class="tab-btn" data-tab="bookings" data-i18n="bookingsTab">الحجوزات</button>
        <button class="tab-btn" data-tab="menu" data-i18n="menuTab">القائمة</button>
        <button class="tab-btn" data-tab="settings" data-i18n="settingsTab">الإعدادات</button>
        <button class="tab-btn" data-tab="analytics" data-i18n="analyticsTab">التحليلات</button>
        <button class="tab-btn" data-tab="share" data-i18n="shareNav">مشاركة</button>
      </div>

      <div class="container mt-2">
        <section id="tab-dashboard"></section>
        <section id="tab-orders" class="hidden"></section>
        <section id="tab-bookings" class="hidden"></section>
        <section id="tab-menu" class="hidden"></section>
        <section id="tab-settings" class="hidden"></section>
        <section id="tab-analytics" class="hidden"></section>
        <section id="tab-share" class="hidden"></section>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div id="modal-backdrop" class="modal-backdrop">
    <div class="modal" id="modal-box" role="dialog" aria-modal="true"></div>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/skeleton.js"></script>
</body>
</html>
